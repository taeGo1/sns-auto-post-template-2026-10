name: 一時：動画をドライブに送るテスト（あとで消す）
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - env:
          GH_TOKEN: ${{ github.token }}
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_KEY: ${{ secrets.GAS_KEY }}
          VIDEO_MODE: pattern
        run: |
          pip install -q requests
          gh run download 38264259001 -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/a"
          OUT=$(dirname "$(find "$RUNNER_TEMP/a" -name 'リール用.mp4' | head -1)")
          W=$(dirname "$(find "$RUNNER_TEMP/a" -name 'sns-posts.json' | head -1)")
          ls -la "$OUT"
          python deliver.py "$W" "$OUT"
